name: Auto Update Shopee Deals

on:
  schedule:
    - cron: '0 */6 * * *' # Tự động chạy mỗi 6 tiếng 1 lần
  workflow_dispatch: # Cho phép bấm chạy thủ công bằng tay trên GitHub

jobs:
  update-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run script update deals
        run: python app.py

      - name: Commit and push updated deals.json
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add deals.json
          git commit -m "Auto update deals.json via GitHub Actions" || exit 0
          git push